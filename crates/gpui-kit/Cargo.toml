[workspace]

[package]
name = "a2ui-gpui-kit"
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Liangdi/a2ui"
description = "GPUI Kit adapter for A2UI agent-generated interfaces"

[features]
default = []
backend = ["dep:gpui-kit", "dep:a2ui-image"]

[dependencies]
a2ui-base = { path = "../core", version = "0.3.1" }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
gpui-kit = { version = "=0.9.1", optional = true }
a2ui-image = { path = "../image", version = "0.3.1", optional = true }

[dev-dependencies]
a2ui-gallery = { path = "../gallery", version = "0.3.1" }
a2ui-tui = { path = "../tui", version = "0.3.1" }
serde_json = "1"
anyhow = "1"

[[example]]
name = "gallery"
required-features = ["backend"]

[[example]]
name = "accessibility"
required-features = ["backend"]

[[example]]
name = "validated"
required-features = ["backend"]
